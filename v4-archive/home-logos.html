<!-- ========== AG SECTION: logos-marquee (Home) ========== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  .ag-logos{--ag-bg:#060607;--ag-surface:#111113;--ag-surface-2:#17171a;--ag-line:rgba(255,255,255,.12);--ag-text:#fbf6ea;--ag-muted:#b9b2a2;--ag-gold:#f0bb4a;--ag-gold-ink:#1a1204;
    position:relative;background:var(--ag-bg);color:var(--ag-text);font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:100px 24px;box-sizing:border-box;overflow:hidden}
  .ag-logos::before{content:"";position:absolute;left:50%;top:-10%;width:90%;height:60%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(240,187,74,.10),transparent 70%);pointer-events:none}
  .ag-logos *,.ag-logos *::before,.ag-logos *::after{box-sizing:border-box}
  .ag-logos__wrap{position:relative;max-width:1248px;margin:0 auto}
  .ag-logos__head{max-width:760px;margin-bottom:48px}
  .ag-logos__head--row{max-width:none;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .ag-logos__kick{display:inline-flex;align-items:center;gap:10px;padding:7px 16px 7px 8px;border:1px solid var(--ag-line);border-radius:999px;font-size:.86rem;color:var(--ag-muted);background:rgba(255,255,255,.05)}
  .ag-logos__kick img{width:26px;height:26px}
  .ag-logos__title{margin:20px 0 0;font-weight:800;letter-spacing:-.03em;line-height:1.08;font-size:clamp(1.9rem,2.3vw + 1rem,3.1rem)}
  .ag-logos__title em{font-style:normal;color:var(--ag-gold)}
  .ag-logos__lead{margin:16px 0 0;font-size:1.1rem;line-height:1.6;color:var(--ag-muted);max-width:56ch}
  .ag-logos__link{display:inline-flex;align-items:center;gap:8px;color:var(--ag-gold);font-weight:700;text-decoration:none;font-size:1rem;white-space:nowrap}
  .ag-logos__link:hover{text-decoration:underline;text-underline-offset:4px}
  .ag-logos__btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:14px;border:1px solid rgba(255,255,255,.22);color:var(--ag-text);text-decoration:none;font-weight:700;transition:border-color .2s,transform .2s,background .2s,box-shadow .2s}
  .ag-logos__btn:hover{border-color:var(--ag-gold);transform:translateY(-2px)}
  .ag-logos__btn--gold{background:var(--ag-gold);color:var(--ag-gold-ink);border-color:var(--ag-gold);box-shadow:0 12px 36px -8px rgba(240,187,74,.65)}
  .ag-logos__btn--gold:hover{background:#ffd070;box-shadow:0 16px 44px -8px rgba(240,187,74,.9)}
  .ag-logos.ag-pre [data-r]{opacity:0;filter:blur(8px);transform:translateY(22px)}
  .ag-logos [data-r]{transition:opacity .8s cubic-bezier(.2,.7,.2,1),filter .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0) * 80ms)}
  .ag-logos.ag-pre [data-r].ag-in{opacity:1;filter:none;transform:none}
  .ag-logos .ag-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:rgba(240,187,74,.85);font-weight:700;font-size:.9rem;border:1.5px dashed rgba(240,187,74,.55);background:repeating-linear-gradient(135deg,rgba(240,187,74,.05) 0 12px,transparent 12px 24px)}
  .ag-logos .ag-ph svg{width:34px;height:34px;fill:currentColor;opacity:.8}
  @media (max-width:700px){.ag-logos{padding:68px 20px}}
  @media (prefers-reduced-motion:reduce){.ag-logos.ag-pre [data-r]{opacity:1;filter:none;transform:none}.ag-logos [data-r]{transition:none}}

  .ag-logos{padding:44px 0 52px;border-top:1px solid var(--ag-line);border-bottom:1px solid var(--ag-line)}
  .ag-logos__label{position:relative;text-align:center;margin:0 0 26px;font-size:.88rem;font-weight:700;letter-spacing:.02em;color:var(--ag-muted)}
  .ag-logos__row{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);padding:14px 0}
  .ag-logos__track{display:flex;gap:22px;width:max-content;animation:ag-logos-run 40s linear infinite}
  .ag-logos__row:hover .ag-logos__track{animation-play-state:paused}
  .ag-logos__tile{flex:none;width:104px;height:104px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(160deg,#fffaf0,#e9e1cf);box-shadow:0 18px 30px -14px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.4) inset,0 0 40px -10px rgba(240,187,74,.35);transition:transform .3s}
  .ag-logos__tile:hover{transform:translateY(-8px) rotate(-3deg) scale(1.06)}
  .ag-logos__tile img{width:54px;height:54px;object-fit:contain}
  .ag-logos__txt span{font-weight:800;font-size:1.5rem;letter-spacing:-.03em}
  .ag-logos__mask{display:block;width:54px;height:54px;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
  @keyframes ag-logos-run{to{transform:translateX(-33.3333%)}}
  @media (max-width:700px){.ag-logos__tile{width:84px;height:84px;border-radius:22px}.ag-logos__tile img,.ag-logos__mask{width:42px;height:42px}}
  @media (prefers-reduced-motion:reduce){.ag-logos__track{animation:none}}
</style>

(function(){

  function em(){var im=root.querySelectorAll('img[data-em]');for(var i=0;i<im.length;i++){if(im[i].getAttribute('src'))continue;var p=im[i].getAttribute('data-em').split('|');im[i].onerror=function(){this.style.visibility='hidden'};im[i].src=(window.AGE&&window.AGE[p[0]])||(BASE+encodeURIComponent(p[0])+'/3D/'+p[1]+'_3d.png');}}
  var LINKS={ home:'/', work:'/projects', services:'/services', about:'/about', contact:'/contact' };
  var CALENDLY_URL='', WHATSAPP='2348176376470';
  
  em();
  var al=root.querySelectorAll('[data-ag-link]');for(var j=0;j<al.length;j++){var k=al[j].getAttribute('data-ag-link');if(LINKS[k])al[j].setAttribute('href',LINKS[k]);}
  var calls=root.querySelectorAll('[data-ag-call]');for(var c=0;c<calls.length;c++){calls[c].setAttribute('href',CALENDLY_URL||('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent("Hi Azeez, I'd like to book a free 20-minute discovery call.")));}
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var els=root.querySelectorAll('[data-r]');
  if('IntersectionObserver' in window&&!reduce){
    root.className+=' ag-pre';
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('ag-in');io.unobserve(e.target);}});},{threshold:.1,rootMargin:'0px 0px -5% 0px'});
    for(var i=0;i<els.length;i++)io.observe(els[i]);
    setTimeout(function(){for(var i=0;i<els.length;i++)els[i].classList.add('ag-in');},7000);
  }
  var fine=window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
  if(fine&&!reduce){
