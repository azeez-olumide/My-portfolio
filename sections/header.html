<style>
.ag-theme{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;margin-left:8px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#f8f3e9;cursor:pointer;padding:0;transition:background .25s,border-color .25s,transform .35s}
.ag-theme:hover{border-color:#f0b93e;background:rgba(240,185,62,.16);transform:rotate(18deg)}
.ag-theme:focus-visible{outline:2px solid #ffd479;outline-offset:3px}
.ag-theme svg{width:20px;height:20px;grid-area:1/1;transition:opacity .25s,transform .35s}
.ag-theme .ag-th-moon{opacity:0;transform:scale(.6) rotate(-40deg)}
html[data-ag-theme="light"] .ag-theme .ag-th-sun{opacity:0;transform:scale(.6) rotate(40deg)}
html[data-ag-theme="light"] .ag-theme .ag-th-moon{opacity:1;transform:none}
@media (max-width:900px){.ag-top__toggle{order:3}.ag-theme{order:2;margin-left:auto;margin-right:8px}.ag-top__brand{order:1}}

  .ag-top{
    --ag-bg:#07070a; --ag-surface:#0e0e13; --ag-line:rgba(255,255,255,.1);
    --ag-text:#f8f3e9; --ag-muted:#b9b1a1; --ag-gold:#f0b93e; --ag-gold-ink:#1a1204;
    position:fixed;top:0;left:0;right:0;z-index:9990;font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--ag-text);box-sizing:border-box}
  .ag-top *,.ag-top *::before,.ag-top *::after{box-sizing:border-box}
  .ag-top__bar{height:36px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;background:#0e0e13;border-bottom:1px solid var(--ag-line);
    font-size:.82rem;color:var(--ag-muted);overflow:hidden;transition:height .3s ease,opacity .3s ease,border-color .3s}
  .ag-top__bar a{color:var(--ag-gold);text-decoration:underline;text-underline-offset:3px;font-weight:600;white-space:nowrap}
  .ag-top__bar a:hover{color:#f4c862}
  .ag-top.ag-scrolled .ag-top__bar{height:0;opacity:0;border-color:transparent}
  .ag-top__nav{height:68px;background:transparent;border-bottom:1px solid transparent;transition:background .3s ease,border-color .3s ease}
  .ag-top.ag-scrolled .ag-top__nav,.ag-top.ag-open .ag-top__nav{background:rgba(6,6,7,.96);border-bottom-color:var(--ag-line)}
  .ag-top__inner{max-width:1248px;height:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .ag-top__brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ag-text)}
  .ag-top__mark{height:30px;width:auto;display:block}
  .ag-top__name{font-weight:700;font-size:1.02rem;letter-spacing:-.005em}
  .ag-top__links{display:flex;align-items:center;gap:4px}
  .ag-top__link{padding:10px 14px;font-size:.95rem;font-weight:500;color:var(--ag-muted);text-decoration:none;border-radius:8px;transition:color .2s}
  .ag-top__link:hover,.ag-top__link.ag-active{color:var(--ag-text)}
  .ag-top__link.ag-active{box-shadow:inset 0 -2px 0 var(--ag-gold);border-radius:0}
  .ag-top__cta{margin-left:12px;display:inline-flex;align-items:center;padding:11px 20px;border-radius:10px;font-weight:700;font-size:.93rem;text-decoration:none;
    color:var(--ag-gold-ink);background:var(--ag-gold);transition:background .2s,transform .2s}
  .ag-top__cta:hover{background:#ffd479;transform:translateY(-1px)}
  .ag-top__toggle{display:none;width:44px;height:44px;border:1px solid var(--ag-line);border-radius:10px;background:transparent;cursor:pointer;padding:0;position:relative}
  .ag-top__toggle span{position:absolute;left:12px;right:12px;height:2px;border-radius:2px;background:var(--ag-text);transition:transform .25s,opacity .25s,top .25s}
  .ag-top__toggle span:nth-child(1){top:15px}.ag-top__toggle span:nth-child(2){top:21px}.ag-top__toggle span:nth-child(3){top:27px}
  .ag-top.ag-open .ag-top__toggle span:nth-child(1){top:21px;transform:rotate(45deg)}
  .ag-top.ag-open .ag-top__toggle span:nth-child(2){opacity:0}
  .ag-top.ag-open .ag-top__toggle span:nth-child(3){top:21px;transform:rotate(-45deg)}
  .ag-top a:focus-visible,.ag-top button:focus-visible{outline:2px solid var(--ag-gold);outline-offset:3px;border-radius:6px}
  @media (max-width:900px){
    .ag-top__toggle{display:block}
    .ag-top__links{position:fixed;left:0;right:0;top:104px;flex-direction:column;align-items:stretch;gap:0;padding:8px 24px 24px;background:#07070a;border-bottom:1px solid var(--ag-line);
      opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s,transform .25s,visibility .25s}
    .ag-top.ag-scrolled .ag-top__links{top:68px}
    .ag-top.ag-open .ag-top__links{opacity:1;visibility:visible;transform:none}
    .ag-top__link{padding:16px 0;font-size:1.05rem;border-bottom:1px solid var(--ag-line);border-radius:0}
    .ag-top__link.ag-active{box-shadow:none;color:var(--ag-gold)}
    .ag-top__cta{margin:18px 0 0;padding:15px 20px;justify-content:center;font-size:1rem}
  }
  @media (max-width:520px){.ag-top__bar{font-size:.8rem;gap:8px;padding:0 10px}.ag-top__extra{display:none}.ag-top__name{font-size:.95rem}}
/* agHdrLight */
html[data-ag-theme="light"] .ag-top__nav{background:rgba(7,7,10,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
</style>

<script>
(function(){
  var el=document.getElementById('ag-top'); if(!el||el.dataset.agInit) return; el.dataset.agInit='1';

  /* ---- EDIT THESE: the exact URL path of each of your GHL pages ---- */
  var LINKS={ home:'/', work:'/work', services:'/services', process:'/process', about:'/about', contact:'/contact', start:'/start' };

  var anchors=el.querySelectorAll('[data-ag-link]');
  for(var i=0;i<anchors.length;i++){var k=anchors[i].getAttribute('data-ag-link'); if(LINKS[k]) anchors[i].setAttribute('href',LINKS[k]);}
  var path=location.pathname.replace(/\/+$/,'')||'/';
  var navLinks=el.querySelectorAll('.ag-top__link');
  for(var j=0;j<navLinks.length;j++){ var h=(navLinks[j].getAttribute('href')||'').replace(/\/+$/,'')||'/'; if(h===path) navLinks[j].classList.add('ag-active'); }

  function onScroll(){ el.classList.toggle('ag-scrolled',(window.pageYOffset||document.documentElement.scrollTop)>24); }
  onScroll(); window.addEventListener('scroll',onScroll,{passive:true});

  var btn=el.querySelector('.ag-top__toggle');
  function setOpen(o){ el.classList.toggle('ag-open',o); btn.setAttribute('aria-expanded',o?'true':'false'); btn.setAttribute('aria-label',o?'Close menu':'Open menu'); }
  btn.addEventListener('click',function(){ setOpen(!el.classList.contains('ag-open')); });
  el.querySelector('.ag-top__links').addEventListener('click',function(e){ if(e.target.closest&&e.target.closest('a')) setOpen(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') setOpen(false); });
  window.addEventListener('resize',function(){ if(window.innerWidth>900) setOpen(false); });

  function agToggleTheme(){var h=document.documentElement,n=h.getAttribute('data-ag-theme')==='light'?'dark':'light';h.setAttribute('data-ag-theme',n);try{localStorage.setItem('agTheme',n);}catch(e){}var b=document.querySelectorAll('.ag-theme');for(var i=0;i<b.length;i++){b[i].setAttribute('aria-pressed',n==='light'?'true':'false');b[i].setAttribute('aria-label',n==='light'?'Switch to dark mode':'Switch to light mode');}}
  (function(){var b=document.querySelectorAll('.ag-theme');for(var i=0;i<b.length;i++){if(b[i].getAttribute('data-ag-b'))continue;b[i].setAttribute('data-ag-b','1');b[i].addEventListener('click',agToggleTheme);var l=document.documentElement.getAttribute('data-ag-theme')==='light';b[i].setAttribute('aria-pressed',l?'true':'false');b[i].setAttribute('aria-label',l?'Switch to dark mode':'Switch to light mode');}})();
})();
</script>
