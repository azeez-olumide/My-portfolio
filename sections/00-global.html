<!-- ========== AG SECTION: global (paste ONCE per site or once per page; optional) ==========
     Holds the shared brand tokens, fonts and the reduced-motion rule.
     Every other section also carries its own fallback tokens, so the site still works if this block is skipped.
     To change the brand gold everywhere, edit the values below. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Surfaces */
    --ag-bg:#07070a; --ag-surface:#0e0e13; --ag-surface-2:#15151b; --ag-line:rgba(255,255,255,.1);
    /* Text */
    --ag-text:#f8f3e9; --ag-muted:#b9b1a1;
    /* One accent: flat gold from the logo (no gradients) */
    --ag-gold:#f0b93e; --ag-gold-hover:#ffd479; --ag-gold-ink:#1a1204;
    /* Shape */
    --ag-radius:14px; --ag-radius-sm:10px; --ag-container:1200px;
    /* Font: one family */
    --ag-font:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-reduced-motion:reduce){
    [class^="ag-"],[class*=" ag-"],[class^="ag-"] *,[class*=" ag-"] *{
      animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }
</style>

<!-- ========== AG SITE LINKS: the ONE place to set your page addresses ==========
     Every menu link, button and project card on every page is fixed up from this table when the page loads,
     so you never have to edit links inside the other blocks.
     1. BASE: text put in front of every address. Leave '' if your pages live at yourdomain.com/work, /about ...
        If GHL puts them under a funnel or site path, e.g. yourdomain.com/portfolio/work, set BASE:'/portfolio'.
     2. MAP: the real address of each page in GHL. Left side = the address the code uses, right side = yours.
     3. PROJECTS: the start of each project page address. Use '/work/' if you made paths like work/cropzone-africa,
        or '/work-' if GHL only let you make flat paths like work-cropzone-africa.
     4. FULL: set true if you want links to use your full domain, e.g. DOMAIN:'https://www.yourdomain.com'. -->
<script>
(function(){
  if(window.__agLinks) return; window.__agLinks=1;
  /* ---- EDIT ---- */
  var DOMAIN='';                 /* optional, e.g. 'https://www.azeezgazalle.com' (no trailing slash) */
  var BASE='';                   /* optional path prefix, e.g. '/portfolio' */
  var MAP={ '/':'/', '/work':'/work', '/services':'/services', '/process':'/process', '/about':'/about', '/contact':'/contact', '/start':'/start' };
  var PROJECTS='/work/';         /* '/work/' or '/work-' */
  /* -------------- */
  function fix(a){
    var h=a.getAttribute('href'); if(!h||h.charAt(0)!=='/'||h.charAt(1)==='/') return;
    if(a.getAttribute('data-ag-fixed')===h) return;
    var m=h.match(/^([^?#]*)([?#].*)?$/), p=m[1], rest=m[2]||'', out;
    if(p.length>1&&p.charAt(p.length-1)==='/') p=p.slice(0,-1);
    if(MAP.hasOwnProperty(p)) out=MAP[p];
    else if(p.indexOf('/work/')===0) out=PROJECTS+p.slice(6);
    else out=p;
    out=DOMAIN+BASE+out; if(out==='') out='/';
    a.setAttribute('href',out+rest); a.setAttribute('data-ag-fixed',out+rest);
  }
  function run(){var l=document.querySelectorAll('a[href^="/"]');for(var i=0;i<l.length;i++)fix(l[i]);}
  /* Cards and menus are built by scripts after load, so keep watching for new links. */
  function go(){run(); try{new MutationObserver(run).observe(document.body,{childList:true,subtree:true});}catch(e){}}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go); else go();
  window.addEventListener('load',run);
})();
</script>
