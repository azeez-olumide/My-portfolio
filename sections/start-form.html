<style>
.ag-theme{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;margin-left:8px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#f8f3e9;cursor:pointer;padding:0;transition:background .25s,border-color .25s,transform .35s}
.ag-theme:hover{border-color:#f0b93e;background:rgba(240,185,62,.16);transform:rotate(18deg)}
.ag-theme:focus-visible{outline:2px solid #ffd479;outline-offset:3px}
.ag-theme svg{width:20px;height:20px;grid-area:1/1;transition:opacity .25s,transform .35s}
.ag-theme .ag-th-moon{opacity:0;transform:scale(.6) rotate(-40deg)}
html[data-ag-theme="light"] .ag-theme .ag-th-sun{opacity:0;transform:scale(.6) rotate(40deg)}
html[data-ag-theme="light"] .ag-theme .ag-th-moon{opacity:1;transform:none}

  .ag-sf-contact{
    --ag-bg:#07070a; --ag-surface:#0e0e13; --ag-surface-2:#15151b; --ag-line:rgba(255,255,255,.1);
    --ag-text:#f8f3e9; --ag-muted:#b9b1a1; --ag-gold:#f0b93e; --ag-gold-ink:#1a1204; --ag-error:#ff8f8f;
    background:var(--ag-bg);color:var(--ag-text);padding:112px 24px;border-top:1px solid var(--ag-line);
    font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;scroll-margin-top:90px}
  .ag-sf-contact *{box-sizing:border-box}
  .ag-contact__inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:72px;align-items:start}

  .ag-contact__title{margin:0;font-size:clamp(2rem,2.8vw + 1rem,3.3rem);font-weight:700;letter-spacing:-.03em;line-height:1.08;color:#fff;text-wrap:balance}
  .ag-contact__lead{margin:22px 0 0;max-width:30em;font-size:1.12rem;line-height:1.65;color:var(--ag-muted)}
  .ag-contact__promise{margin:22px 0 0;padding:14px 0;border-top:1px solid var(--ag-line);border-bottom:1px solid var(--ag-line);font-size:.98rem;color:var(--ag-text)}
  .ag-contact__promise span{color:var(--ag-muted)}

  .ag-contact__call{margin-top:36px;padding:26px;border:1px solid var(--ag-line);border-radius:14px;background:var(--ag-surface);scroll-margin-top:100px}
  .ag-contact__call h3{margin:0 0 8px;font-size:1.15rem;font-weight:700;color:#fff}
  .ag-contact__call p{margin:0 0 18px;font-size:.98rem;line-height:1.6;color:var(--ag-muted)}
  .ag-contact__direct{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:10px;font-size:.98rem}
  .ag-contact__direct li{display:flex;gap:12px;color:var(--ag-muted)}
  .ag-contact__direct b{min-width:84px;font-weight:600;color:var(--ag-text)}
  .ag-sf-contact a{color:var(--ag-text)}
  .ag-contact__direct a{text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:3px}
  .ag-contact__direct a:hover{text-decoration-color:var(--ag-gold);color:#fff}

  .ag-btn2{display:inline-flex;align-items:center;justify-content:center;padding:15px 24px;border-radius:10px;font-family:inherit;font-weight:700;font-size:1rem;line-height:1.2;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s}
  .ag-btn2--gold{background:var(--ag-gold);color:var(--ag-gold-ink)}
  .ag-btn2--gold:hover{background:#ffd479;transform:translateY(-1px)}
  .ag-btn2--line{background:transparent;color:var(--ag-text)!important;border-color:rgba(255,255,255,.26)}
  .ag-btn2--line:hover{border-color:var(--ag-gold)}
  .ag-btn2[disabled]{opacity:.55;cursor:not-allowed;transform:none}
  .ag-sf-contact a:focus-visible,.ag-sf-contact button:focus-visible,.ag-sf-contact input:focus-visible,.ag-sf-contact textarea:focus-visible{outline:2px solid var(--ag-gold);outline-offset:3px}

  /* ---- form card ---- */
  .ag-sf-form{border:1px solid var(--ag-line);border-radius:16px;background:var(--ag-surface);padding:32px;min-height:430px;display:flex;flex-direction:column}
  .ag-form__top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;font-size:.88rem;color:var(--ag-muted)}
  .ag-form__bar{height:4px;border-radius:4px;background:var(--ag-surface-2);overflow:hidden;margin-bottom:34px}
  .ag-form__bar i{display:block;height:100%;width:0;background:var(--ag-gold);transition:width .35s ease}
  .ag-sf-form fieldset{border:0;margin:0;padding:0;min-width:0;flex:1}
  .ag-sf-form legend{padding:0;margin:0 0 6px;font-size:clamp(1.35rem,1vw + 1.1rem,1.75rem);font-weight:700;letter-spacing:-.02em;line-height:1.2;color:#fff}
  .ag-form__hint{margin:0 0 22px;font-size:.95rem;color:var(--ag-muted)}
  .ag-sf-form input[type=text],.ag-sf-form input[type=email],.ag-sf-form textarea{width:100%;padding:16px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#09090a;color:var(--ag-text);font-family:inherit;font-size:1.05rem;line-height:1.4}
  .ag-sf-form textarea{min-height:150px;resize:vertical}
  .ag-sf-form input::placeholder,.ag-sf-form textarea::placeholder{color:#8f8878}
  .ag-sf-form input:focus,.ag-sf-form textarea:focus{border-color:var(--ag-gold)}
  .ag-form__choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ag-form__choice{position:relative;display:block}
  .ag-form__choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
  .ag-form__choice span{display:block;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#09090a;font-size:.98rem;font-weight:500;line-height:1.3;color:var(--ag-text);transition:border-color .2s,background .2s}
  .ag-form__choice:hover span{border-color:rgba(229,176,64,.6)}
  .ag-form__choice input:checked+span{border-color:var(--ag-gold);background:rgba(229,176,64,.12);color:#fff;font-weight:600}
  .ag-form__choice input:focus-visible+span{outline:2px solid var(--ag-gold);outline-offset:2px}
  .ag-form__err{min-height:1.3em;margin:12px 0 0;font-size:.92rem;color:var(--ag-error)}
  .ag-form__nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
  .ag-form__back{background:none;border:0;padding:12px 4px;color:var(--ag-muted);font-family:inherit;font-size:.98rem;font-weight:600;cursor:pointer}
  .ag-form__back:hover{color:#fff}
  .ag-form__back[hidden]{display:none}
  .ag-form__hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .ag-form__done h3{margin:0 0 10px;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;color:#fff}
  .ag-form__done p{margin:0 0 20px;font-size:1.02rem;line-height:1.65;color:var(--ag-muted)}
  .ag-form__done .ag-form__row{display:flex;flex-wrap:wrap;gap:12px}
  .ag-form__sum{margin:0 0 20px;padding:0;list-style:none;border-top:1px solid var(--ag-line)}
  .ag-form__sum li{display:flex;gap:14px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ag-line);font-size:.92rem;color:var(--ag-muted)}
  .ag-form__sum b{color:var(--ag-text);font-weight:600;text-align:right;max-width:62%;overflow-wrap:anywhere}

  @media (max-width:980px){.ag-sf-contact{padding:80px 22px}.ag-contact__inner{grid-template-columns:minmax(0,1fr);gap:48px}}
  @media (max-width:560px){.ag-sf-contact{padding:64px 20px}.ag-sf-form{padding:22px 18px}.ag-form__choices{grid-template-columns:minmax(0,1fr)}.ag-contact__direct li{flex-direction:column;gap:2px}.ag-btn2{width:100%}.ag-form__nav .ag-btn2{width:auto;flex:1}}
  .ag-sf-contact{position:relative;overflow:hidden;padding-top:150px}
  .ag-sf-contact::before{content:"";position:absolute;right:-10%;top:-6%;width:60vw;height:60vw;max-width:860px;max-height:860px;background:radial-gradient(closest-side,rgba(240,185,62,.22),rgba(240,185,62,.07) 55%,transparent 74%);pointer-events:none}
  .ag-contact__inner{position:relative}
  .ag-contact__tz{margin:6px 0 0;font-size:.88rem;color:#b9b1a1}
  .ag-contact__tz b{color:#ffd479}
html[data-ag-theme="light"] .ag-sf-contact{--ag-bg:#f4efe3;--ag-surface:#fffdf8;--ag-surface-2:#ebe4d3;--ag-line:rgba(10,10,12,.14);--ag-text:#0b0b0e;--ag-muted:#5a5446;background:#f4efe3;color:#0b0b0e}
html[data-ag-theme="light"] .ag-sf-contact::before{opacity:.6}
html[data-ag-theme="light"] .ag-sf-contact .ag-sf-form{background:#fffdf8;border-color:rgba(10,10,12,.16);box-shadow:0 30px 80px -40px rgba(122,79,0,.35)}
html[data-ag-theme="light"] .ag-sf-contact legend,html[data-ag-theme="light"] .ag-sf-contact .ag-form__done h3,html[data-ag-theme="light"] .ag-contact__title,html[data-ag-theme="light"] .ag-contact__call h3{color:#0b0b0e}
html[data-ag-theme="light"] .ag-sf-contact .ag-sf-form input[type=text],html[data-ag-theme="light"] .ag-sf-contact .ag-sf-form input[type=email],html[data-ag-theme="light"] .ag-sf-contact .ag-sf-form textarea{background:#fff;color:#0b0b0e;border-color:rgba(10,10,12,.3)}
html[data-ag-theme="light"] .ag-sf-contact .ag-sf-form input::placeholder,html[data-ag-theme="light"] .ag-sf-contact .ag-sf-form textarea::placeholder{color:#7a7364}
html[data-ag-theme="light"] .ag-sf-contact .ag-form__choice span{background:#fff;color:#0b0b0e;border-color:rgba(10,10,12,.3)}
html[data-ag-theme="light"] .ag-sf-contact .ag-form__choice input:checked+span{background:rgba(240,185,62,.28);border-color:#7a4f00;color:#0b0b0e}
html[data-ag-theme="light"] .ag-sf-contact .ag-form__back:hover{color:#0b0b0e}
html[data-ag-theme="light"] .ag-sf-contact .ag-form__bar{background:#ebe4d3}
html[data-ag-theme="light"] .ag-sf-contact .ag-form__sum b{color:#0b0b0e}
html[data-ag-theme="light"] .ag-sf-contact .ag-btn2--line{color:#0b0b0e!important;border-color:rgba(10,10,12,.35)}
html[data-ag-theme="light"] .ag-contact__call{background:#fffdf8}
html[data-ag-theme="light"] .ag-sf-contact a{color:#0b0b0e}
html[data-ag-theme="light"] .ag-sf-contact .ag-btn2--gold{color:#1a1204}
html[data-ag-theme="light"] .ag-contact__tz b{color:#7a4f00}
html[data-ag-theme="light"] .ag-contact__tz{color:#5a5446}
html[data-ag-theme="light"] .ag-sf__x{color:#0b0b0e;border-color:rgba(10,10,12,.3);background:rgba(10,10,12,.04)}
/* agStartTh */
html[data-ag-theme="light"] .ag-sf__bar .ag-theme{color:#0b0b0e;border-color:rgba(10,10,12,.3);background:rgba(10,10,12,.04)}

  function waLink(msg){ return 'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg); }

  function render(){
    var s=STEPS[idx], last=idx===STEPS.length-1, v=data[s.id]||'', html='';
    el.label.textContent='Step '+(idx+1)+' of '+STEPS.length; el.bar.style.width=((idx+1)/STEPS.length*100)+'%';
    html+='<fieldset><legend id="ag-sf-q">'+esc(s.label)+'</legend><p class="ag-form__hint">'+esc(s.hint)+'</p>';
    if(s.type==='choice'){
      html+='<div class="ag-form__choices" role="radiogroup" aria-labelledby="ag-sf-q">';
      s.options.forEach(function(o,n){ html+='<label class="ag-form__choice"><input type="radio" name="'+s.id+'" value="'+esc(o)+'"'+(v===o?' checked':'')+'><span>'+esc(o)+'</span></label>'; });
      html+='</div>';
    }else if(s.type==='textarea'){
      html+='<textarea id="ag-sf-f" name="'+s.id+'" placeholder="'+esc(s.ph||'')+'" aria-labelledby="ag-sf-q">'+esc(v)+'</textarea>';
    }else{
      html+='<input id="ag-sf-f" type="'+s.type+'" name="'+s.id+'" value="'+esc(v)+'" placeholder="'+esc(s.ph||'')+'" autocomplete="'+(s.auto||'off')+'" aria-labelledby="ag-sf-q">';
    }
    html+='</fieldset>';
    el.step.innerHTML=html; el.err.textContent='';
    el.back.hidden=idx===0;
    el.next.textContent=last?(WEBHOOK_URL?'Send project details':'Send on WhatsApp'):'Continue';
    var f=document.getElementById('ag-sf-f'); if(f){ f.focus({preventScroll:true}); }
    if(s.type==='choice'){ var inputs=el.step.querySelectorAll('input[type=radio]'); inputs.forEach(function(r){ r.addEventListener('change',function(){ data[s.id]=r.value; el.err.textContent=''; }); }); }
  }
  function read(){ var s=STEPS[idx]; if(s.type==='choice'){ var c=el.step.querySelector('input[type=radio]:checked'); data[s.id]=c?c.value:''; } else { var f=document.getElementById('ag-sf-f'); data[s.id]=f?f.value.trim():''; } }
  function validate(){
    var s=STEPS[idx], v=data[s.id]||'';
    if(s.required&&!v){ return s.type==='choice'?'Please choose one option.':'Please fill this in to continue.'; }
    if(s.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Please enter a valid email address, like name@company.com.';
    if(s.min&&v.length<s.min) return 'Please add a little more detail (at least '+s.min+' characters).';
    return '';
  }
  function summaryText(){
    return "Hi Azeez, I'd like to start a project.\n\nName: "+data.name+"\nEmail: "+data.email+"\nBusiness: "+data.business+"\nProject type: "+data.projectType+"\nBudget: "+data.budget+"\nTimeline: "+data.timeline+"\n\nAbout the project:\n"+data.description;
  }
  function done(viaWhatsApp){
    sent=true; el.nav.style.display='none'; el.top.style.display='none'; root.querySelector('.ag-form__bar').style.display='none'; el.err.textContent='';
    var first=esc((data.name||'').split(' ')[0]||'there');
    var h='<div class="ag-form__done"><h3>'+(viaWhatsApp?'One last step, '+first:'Thank you, '+first)+'.</h3>';
    h+= viaWhatsApp
      ? '<p>Your details are ready. Tap the button to send them to me on WhatsApp. I reply within 24 business hours, Monday to Friday.</p><div class="ag-form__row"><a class="ag-btn2 ag-btn2--gold" target="_blank" rel="noopener" href="'+waLink(summaryText())+'">Send on WhatsApp</a></div>'
      : '<p>Your project details are in. I will reply to '+esc(data.email)+' within 24 business hours, Monday to Friday.</p><ul class="ag-form__sum"><li>Project<b>'+esc(data.projectType)+'</b></li><li>Budget<b>'+esc(data.budget)+'</b></li><li>Timeline<b>'+esc(data.timeline)+'</b></li></ul><div class="ag-form__row"><a class="ag-btn2 ag-btn2--line" href="'+call.href+'" target="_blank" rel="noopener">Book a Discovery Call</a></div>';
    h+='</div>'; el.step.innerHTML=h;
  }
  function submit(){
    if(el.hp.value){ done(false); return; }            // honeypot: bots fill this field
    if(!WEBHOOK_URL){ done(true); return; }
    var payload={name:data.name,email:data.email,business:data.business,projectType:data.projectType,budget:data.budget,timeline:data.timeline,description:data.description,source:'portfolio-website',page:location.href,submittedAt:new Date().toISOString()};
    el.next.disabled=true; el.next.textContent='Sending...'; el.err.textContent='';
    function fail(){ el.next.disabled=false; el.next.textContent='Send project details'; el.err.innerHTML='That did not go through. Please try again, or <a href="'+waLink(summaryText())+'" target="_blank" rel="noopener">send it on WhatsApp</a>.'; }
    fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){ if(r.ok){ done(false); } else { fail(); } })
      .catch(function(){
        /* some webhooks do not allow cross-site replies; send once more without reading the reply */
        fetch(WEBHOOK_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)}).then(function(){ done(false); }).catch(fail);
      });
  }
  el.form.addEventListener('submit',function(e){
    e.preventDefault(); if(sent) return; read(); var m=validate(); if(m){ el.err.textContent=m; return; }
    if(idx<STEPS.length-1){ idx++; render(); } else { submit(); }
  });
  el.back.addEventListener('click',function(){ if(idx>0){ read(); idx--; render(); } });
  render();
})();
</script>

  (function(){var b=document.querySelectorAll('.ag-theme');for(var i=0;i<b.length;i++){if(b[i].getAttribute('data-ag-b'))continue;b[i].setAttribute('data-ag-b','1');b[i].addEventListener('click',agToggleTheme);var l=document.documentElement.getAttribute('data-ag-theme')==='light';b[i].setAttribute('aria-pressed',l?'true':'false');b[i].setAttribute('aria-label',l?'Switch to dark mode':'Switch to light mode');}})();
})();</script>
